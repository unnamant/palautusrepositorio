{% extends "base.html" %}

{% block title %}{% if warehouse %}Edit Warehouse{% else %}New Warehouse{% endif %} - Warehouse Manager{% endblock %}

{% block content %}
<h1>{% if warehouse %}Edit Warehouse{% else %}New Warehouse{% endif %}</h1>

<form method="POST">
    <div class="form-group">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" value="{{ warehouse.name if warehouse else '' }}" required>
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description">{{ warehouse.description if warehouse and warehouse.description else '' }}</textarea>
    </div>

    <div class="form-group">
        <button type="submit" class="btn btn-success">{% if warehouse %}Update{% else %}Create{% endif %}</button>
        <a href="{% if warehouse %}{{ url_for('main.view_warehouse', warehouse_id=warehouse.id) }}{% else %}{{ url_for('main.index') }}{% endif %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
