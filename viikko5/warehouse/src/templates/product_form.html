{% extends "base.html" %}

{% block title %}{% if product %}Edit Product{% else %}New Product{% endif %} - Warehouse Manager{% endblock %}

{% block content %}
<h1>{% if product %}Edit Product{% else %}New Product{% endif %}</h1>
<p style="color: #666; margin-bottom: 20px;">Warehouse: {{ warehouse.name }}</p>

<form method="POST">
    <div class="form-group">
        <label for="name">Product Name *</label>
        <input type="text" id="name" name="name" value="{{ product.name if product else '' }}" required>
    </div>

    <div class="form-group">
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" value="{{ product.quantity if product else '0' }}" min="0">
    </div>

    <div class="form-group">
        <button type="submit" class="btn btn-success">{% if product %}Update{% else %}Add{% endif %}</button>
        <a href="{{ url_for('main.view_warehouse', warehouse_id=warehouse.id) }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
