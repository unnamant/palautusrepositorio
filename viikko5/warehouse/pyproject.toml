[project]
name = "warehouse"
version = "0.1.0"
description = "Web-based warehouse management application"
authors = []
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
