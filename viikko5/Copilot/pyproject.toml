[tool.poetry]
name = "palautusrepositorio"
version = "0.1.0"
description = "Flask + SQLite scaffold ohtuvarasto-tehtävää varten"
authors = ["Unna Mäntyniemi <unna.mantyniemi@helsinki.fi>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
flask = "^3.0.0"
jinja2 = "^3.1.0"
sqlalchemy = "^2.0.0"

# SQLite ei vaadi erillistä kirjastoa, se kuuluu Pythonin standardikirjastoon.

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-flask = "^1.3.0"
black = "^24.0.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
