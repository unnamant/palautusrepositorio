{% extends "layout.html" %}
{% block content %}
<h2>Varastot</h2>
<form action="{{ url_for('warehouse_add') }}" method="post">
  <input type="text" name="name" placeholder="Uuden varaston nimi" required>
  <button type="submit">Lisää varasto</button>
</form>

{% for w in warehouses %}
  <div class="card">
    <strong>{{ w.name }}</strong><br>
    <a href="{{ url_for('warehouse_view', w_id=w.id) }}">Avaa</a>
  </div>
{% else %}
  <p>Ei varastoja vielä.</p>
{% endfor %}
{% endblock %}
